<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launch Details</title>
  </head>

  <body>
    <div id="loader" class="loader"></div>

    <div id="bodyDetailes"></div>

    <script>
      async function getDetailsLaunches(id) {
        const response = await fetch(
          `https://lldev.thespacedevs.com/2.3.0/launches/${id}/`,
        );

        return await response.json();
      }

      function showLaunchDetails(launch) {
        let box = `<section class="launch-details">

  <div class="hero">

    <img
      src="${launch.image?.image_url || "assets/images/launch-placeholder.png"}"
      onerror="this.src='assets/images/launch-placeholder.png'"
      alt="${launch.name}"
    >

    <div class="overlay"></div>

    <div class="hero-content">

      <span class="status">
        ${launch.status?.name || "Unknown"}
      </span>

      <h1>${launch.name}</h1>

      <p class="provider">
        ${launch.launch_service_provider?.name || "Unknown"}
      </p>

    </div>

  </div>

  <div class="description">

    <h2>Mission Overview</h2>

    <p>
      ${launch.mission?.description || "No description available."}
    </p>

  </div>

  <div class="info-grid">

    <div class="card">
      <h4>🚀 Rocket</h4>
      <p>${launch.rocket?.configuration?.name || "Unknown"}</p>
    </div>

    <div class="card">
      <h4>🏢 Provider</h4>
      <p>${launch.launch_service_provider?.name || "Unknown"}</p>
    </div>

    <div class="card">
      <h4>🌍 Country</h4>
      <p>${launch.pad?.location?.country_code || "Unknown"}</p>
    </div>

    <div class="card">
      <h4>📍 Launch Pad</h4>
      <p>${launch.pad?.name || "Unknown"}</p>
    </div>

    <div class="card">
      <h4>📅 Launch Date</h4>
      <p>${launch.net?.split("T")[0]}</p>
    </div>

    <div class="card">
      <h4>⏰ Launch Time</h4>
      <p>${launch.net?.split("T")[1]?.substring(0, 5)} UTC</p>
    </div>

  </div>

  <div class="buttons">

    ${
      launch.vid_urls?.length
        ? `
      <a href="${launch.vid_urls[0].url}" target="_blank" class="live-btn">
        ▶ Watch Live
      </a>
      `
        : ""
    }

    ${
      launch.info_urls?.length
        ? `
      <a href="${launch.info_urls[0].url}" target="_blank" class="info-btn">
        ℹ More Info
      </a>
      `
        : ""
    }

  </div>

</section>`;
        document.getElementById("bodyDetailes").innerHTML = box;
      }

      async function loadLaunch() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) return;

        const data = await getDetailsLaunches(id);

        showLaunchDetails(data);

        document.getElementById("loader").style.display = "none";
        document.getElementById("bodyDetailes").style.display = "block";
      }

      loadLaunch();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(180deg, #020617, #0f172a);
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      #bodyDetailes {
        display: none;
      }

      .loader {
        position: fixed;
        inset: 0;
        background: #020617;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .loader::after {
        content: "";
        width: 60px;
        height: 60px;
        border: 6px solid #334155;
        border-top: 6px solid #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .launch-details {
        width: 90%;
        max-width: 1200px;
        margin: 40px auto;
      }

      /* Hero */

      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .hero img {
        width: 100%;
        height: 500px;
        object-fit: cover;
        display: block;
        transition: 0.5s;
      }

      .hero:hover img {
        transform: scale(1.06);
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(2, 6, 23, 1),
          rgba(2, 6, 23, 0.3),
          transparent
        );
      }

      .hero-content {
        position: absolute;
        left: 40px;
        bottom: 40px;
        z-index: 2;
      }

      .hero-content h1 {
        font-size: 48px;
        margin: 15px 0;
      }

      .provider {
        color: #cbd5e1;
        font-size: 18px;
      }

      /* Status */

      .status {
        display: inline-block;
        background: #22c55e;
        padding: 10px 22px;
        border-radius: 999px;
        font-weight: bold;
      }

      /* Description */

      .description {
        margin-top: 40px;
        background: #111827;
        border-radius: 20px;
        padding: 35px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .description h2 {
        margin-bottom: 20px;
        color: #60a5fa;
      }

      .description p {
        color: #cbd5e1;
        line-height: 1.9;
      }

      /* Cards */

      .info-grid {
        margin-top: 40px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .card {
        background: #111827;
        border-radius: 20px;
        padding: 25px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-8px);
        border-color: #3b82f6;
        box-shadow: 0 15px 30px rgba(59, 130, 246, 0.25);
      }

      .card h4 {
        color: #60a5fa;
        margin-bottom: 15px;
      }

      .card p {
        font-size: 18px;
      }

      /* Buttons */

      .buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 50px;
      }

      .buttons a {
        text-decoration: none;
        color: white;
        padding: 15px 35px;
        border-radius: 14px;
        font-weight: bold;
        transition: 0.3s;
      }

      .live-btn {
        background: #dc2626;
      }

      .live-btn:hover {
        background: #b91c1c;
        transform: translateY(-4px);
      }

      .info-btn {
        background: #2563eb;
      }

      .info-btn:hover {
        background: #1d4ed8;
        transform: translateY(-4px);
      }

      /* Responsive */

      @media (max-width: 900px) {
        .info-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .hero img {
          height: 400px;
        }

        .hero-content h1 {
          font-size: 34px;
        }
      }

      @media (max-width: 600px) {
        .info-grid {
          grid-template-columns: 1fr;
        }

        .buttons {
          flex-direction: column;
        }

        .buttons a {
          text-align: center;
        }

        .hero-content {
          left: 20px;
          bottom: 20px;
        }

        .hero-content h1 {
          font-size: 28px;
        }
      }
    </style>
  </body>
</html>
